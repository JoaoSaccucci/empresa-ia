<!DOCTYPE html>
<!-- data-tema e data-fonte: valores padrão. O script logo abaixo troca
     pelos valores salvos ANTES de a página aparecer (ver docs/design.md, 11.1). -->
<html lang="pt-BR" data-tema="escuro" data-fonte="3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- O título é trocado pelo título da aula no js/aula.js -->
  <title>Aula | João Saccucci Labs</title>
  <meta name="description" content="Tela de leitura das aulas do professor da João Saccucci Labs.">

  <!--
    Tema e tamanho da letra salvos (US16), aplicados ANTES do CSS.
    Se esperássemos o aula.js (no fim da página), o tema escuro
    apareceria por um instante antes do papel ("piscar").
    try/catch: o localStorage pode estar bloqueado.
  -->
  <script>
    try {
      var temaSalvo = JSON.parse(localStorage.getItem("jsl:leitura-tema"));
      var fonteSalva = JSON.parse(localStorage.getItem("jsl:leitura-fonte"));
      if (temaSalvo === "papel") document.documentElement.setAttribute("data-tema", "papel");
      if (fonteSalva >= 1 && fonteSalva <= 5) document.documentElement.setAttribute("data-fonte", String(fonteSalva));
    } catch (erro) {
      // Sem localStorage: fica o padrão (escuro, letra 3)
    }
  </script>

  <!-- Fontes (Google Fonts), conforme docs/design.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Exo+2:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="modo-foco">
  <!-- Barra de progresso de leitura (o JS muda --progresso de 0 a 1) -->
  <div class="leitura-progresso" aria-hidden="true"><div class="leitura-progresso-barra"></div></div>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">JOÃO SACCUCCI <span>LABS</span></a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">
        <span class="nav-toggle-icone"></span>
        <span class="sr-only">Abrir menu</span>
      </button>

      <!-- A aula faz parte da seção Aulas, por isso ela fica marcada -->
      <nav class="nav" id="menu-principal" aria-label="Menu principal">
        <ul class="nav-lista">
          <li><a class="nav-link" href="index.html">Início</a></li>
          <li><a class="nav-link" href="lista-projetos.html">Projetos</a></li>
          <li><a class="nav-link" href="equipe.html">Equipe</a></li>
          <li><a class="nav-link" href="aulas.html" aria-current="page">Aulas</a></li>
          <li><a class="nav-link" href="sobre.html">Sobre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!--
    Estrutura do docs/design.md, seção 11.4. O js/aula.js preenche
    o cabeçalho, o sumário, o conteúdo e a navegação.
    Atenção: NÃO usar a classe .surgir nesta página (ela quebra o
    balão do glossário no celular).
  -->
  <main class="container aula-layout">
    <aside class="aula-sumario" id="aula-sumario" aria-labelledby="sumario-titulo">
      <div class="aula-sumario-topo">
        <p class="aula-sumario-titulo" id="sumario-titulo">Sumário</p>
        <button class="aula-sumario-fechar" type="button" aria-label="Fechar sumário">&times;</button>
      </div>
      <nav aria-labelledby="sumario-titulo">
        <!-- Gerado pelo JS a partir dos ## e ### da aula -->
        <ol class="sumario-lista" id="sumario-lista"></ol>
      </nav>
    </aside>
    <div class="aula-sumario-fundo"></div>

    <article class="aula" id="aula">
      <a class="voltar" href="aulas.html">&larr; Voltar para as aulas</a>

      <!-- Fica escondido até a aula carregar -->
      <header class="aula-cabecalho" hidden>
        <!-- "Aula 1.2" + link para o módulo (o link é criado pelo JS) -->
        <p class="aula-sobretitulo">
          <span class="aula-numero"></span>
        </p>
        <h1 class="aula-titulo"></h1>
        <p class="aula-meta">
          <!-- img/icones/relogio.svg -->
          <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="aula-tempo"></span>
        </p>
      </header>

      <div class="aula-ferramentas" role="toolbar" aria-label="Ferramentas de leitura">
        <button class="ferramenta aula-sumario-botao" type="button" aria-controls="aula-sumario" aria-expanded="false">
          <!-- img/icones/sumario.svg -->
          <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M13 18h7"/><path d="M4 6h.01M4 12h.01M8 18h.01"/></svg>
          <span>Sumário</span>
        </button>
        <div class="ferramenta-grupo" role="group" aria-label="Tamanho da letra">
          <button class="ferramenta ferramenta-letra" type="button" id="fonte-menos" aria-label="Diminuir letra">A&minus;</button>
          <button class="ferramenta ferramenta-letra" type="button" id="fonte-mais" aria-label="Aumentar letra">A+</button>
        </div>
        <!-- O texto fica sempre "Tema papel"; aria-pressed="true" = papel ligado -->
        <button class="ferramenta" type="button" id="botao-tema" aria-pressed="false">
          <!-- img/icones/tema.svg -->
          <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          <span class="ferramenta-texto">Tema papel</span>
        </button>
        <span class="ferramenta-espaco"></span>
        <!-- Botão compacto de concluir: anda junto com o botão grande do fim -->
        <button class="ferramenta" type="button" data-acao="concluir" aria-pressed="false">
          <!-- img/icones/concluida.svg -->
          <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>
          <span class="ferramenta-texto">Concluída</span>
        </button>
      </div>

      <div class="aula-conteudo" id="aula-conteudo">
        <div class="mensagem aula-mensagem">Carregando aula...</div>
      </div>

      <!-- Fica escondido até a aula carregar -->
      <section class="aula-fim" aria-labelledby="aula-fim-titulo" hidden>
        <p class="aula-fim-texto" id="aula-fim-titulo">Terminou de estudar esta aula?</p>
        <!-- O conteúdo deste botão é trocado pelo JS conforme o estado -->
        <button class="btn aula-concluir" type="button" data-acao="concluir" aria-pressed="false">
          <span>Marcar aula como concluída</span>
        </button>
      </section>

      <!-- Links "Aula anterior" / "Próxima aula" criados pelo JS -->
      <nav class="aula-navegacao" aria-label="Outras aulas" hidden></nav>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 João Saccucci Labs</span>
      <span>Feito por agentes de IA</span>
    </div>
  </footer>

  <!--
    Bibliotecas externas (exceção aprovada pelo João, só nesta página),
    com VERSÃO FIXA na URL:
    - marked 12.0.2: transforma o texto Markdown (.md) em HTML.
    - highlight.js 11.9.0: pinta o código. O tema de cores NÃO vem do
      CDN: está no css/style.css, seção 30.
    "integrity" é uma impressão digital do arquivo: se o CDN entregar
    um arquivo diferente, o navegador não executa. Se a biblioteca não
    carregar, o aula.js mostra um plano B (ver "fallbacks" lá).
  -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
          integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
          integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
          crossorigin="anonymous"></script>

  <!-- Ordem: comum.js (funções de todas as páginas), os dois ajudantes
       da aula (blocos de código e quiz) e, por último, o aula.js, que
       monta a aula e chama as funções dos outros três. -->
  <script src="js/comum.js"></script>
  <script src="js/aula-codigo.js"></script>
  <script src="js/aula-quiz.js"></script>
  <script src="js/aula.js"></script>
</body>
</html>
