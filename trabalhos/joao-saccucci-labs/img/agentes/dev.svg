  <line x1="6" y1="52" x2="14" y2="52" stroke="#FF2BD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="68" x2="14" y2="68" stroke="#FF2BD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="52" x2="114" y2="52" stroke="#FF2BD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="68" x2="114" y2="68" stroke="#FF2BD6" stroke-width="3" stroke-linecap="round"/>
  <!-- visor -->
  <rect x="32" y="34" width="56" height="16" rx="4" fill="#FF2BD6" fill-opacity=".15" stroke="#FF2BD6" stroke-width="2"/>
  <rect x="42" y="39" width="8" height="6" rx="1" fill="#FF2BD6"/>
